<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de AESFACT - AESFACT</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.1"></script>
    <style>
        :root {
            --dark-blue: #04293a;
        }
        body { background-color: #f4f7f6; }
        .aesfact-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .aesfact-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .aesfact-section {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .aesfact-section h3 { margin-top: 0; color: var(--dark-blue); }
        .btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0d5d9e; }
        .file-upload-wrapper { position: relative; }
        .file-upload-wrapper input { opacity: 0; position: absolute; width: 100%; height: 100%; cursor: pointer; }
        .file-upload-wrapper::before { content: '📎 Seleccionar imagen'; display: block; padding: 10px; border: 2px dashed #ccc; border-radius: 6px; text-align: center; background: #f9f9f9; }
    </style>
</head>
<body>
    <div style="background: white; padding: 15px; border-bottom: 1px solid #eee;">
        <div class="aesfact-container" style="padding: 0; display: flex; justify-content: space-between; align-items: center;">
            <a href="admin.html" style="text-decoration: none; color: #555; font-weight: bold;">← Volver al Admin</a>
            <h2 style="margin: 0; color: var(--dark-blue);">Gestión de AESFACT</h2>
        </div>
    </div>

    <div class="aesfact-container">
        <section class="aesfact-section">
            <h3>AESFACT Portada</h3>
            <label>📅 Año Activo</label>
            <input id="aesfact-year" placeholder="Año (ej: 2026)">
            
            <label>🔗 URL de Imagen principal (opcional)</label>
            <input id="aesfact-image-url" placeholder="https://...">
            
            <label>🖼️ O sube la imagen de portada aquí:</label>
            <div class="file-upload-wrapper">
                <input id="aesfact-image-file" type="file" accept="image/*">
            </div>
            
            <button id="save-aesfact" class="btn" style="margin-top: 10px;">Guardar Portada</button>
        </section>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Inicializar Supabase
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            // Verificar permisos
            const permsRaw = sessionStorage.getItem('aesfact_permissions');
            if (!permsRaw || !JSON.parse(permsRaw).includes('aesfact')) {
                alert('⛔ Acceso Restringido: No tienes permisos para gestionar AESFACT.');
                window.location.href = 'admin.html';
                return;
            }

            // Cargar datos de AESFACT
            const data = await readData();
            if (data && data.aesfact) {
                document.getElementById('aesfact-year').value = data.aesfact.year || '';
                // Si hay imagen, mostrarla o algo
            }
        });
    </script>
