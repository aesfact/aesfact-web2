<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Mensajes - AESFACT</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.1"></script>
    <style>
        :root {
            --dark-blue: #04293a;
            --blue-accent: #013a63;
            --blue-light: #0d5d9e;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), #f1f5f9);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
        }

        /* Header minimalista */
        .admin-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
        }

        .admin-header .contacts-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0;
        }

        .admin-header .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .admin-header .back-link:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .admin-header h2 {
            margin: 0;
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Contenedor principal */
        .contacts-container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Secciones */
        .contacts-section {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .contacts-section h3 { margin-top: 0; color: var(--dark-blue); }

        /* Tarjetas de mensajes mejoradas */
        .message-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--blue-accent), var(--blue-light));
        }

        .message-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--blue-light);
        }

        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .message-name { font-weight: bold; color: var(--dark-blue); }
        .message-date { color: #666; font-size: 0.9rem; }
        .message-email, .message-phone { color: #555; margin: 5px 0; }
        .message-body { margin-top: 10px; line-height: 1.5; }

        /* Badges de estado mejorados */
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .status-pendiente {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        .status-respondido {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            border: 1px solid #10b981;
        }

        /* Notificaciones mejoradas */
        .notification {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            z-index: 1000;
            transition: var(--transition);
            max-width: 400px;
            backdrop-filter: blur(8px);
            font-weight: 500;
        }

        .notification::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--blue-accent);
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        }

        .notification.error::before {
            background: #ef4444;
        }

        .notification.error {
            border-color: #fecaca;
        }

        .notification.hidden {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
        }

        /* Animación de entrada */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification {
            animation: slideIn 0.3s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contacts-container {
                padding: 1rem 0.5rem;
            }

            .contacts-section {
                padding: 1.5rem;
            }

            .message-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .admin-header .contacts-container {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="contacts-container">
            <a href="admin.html" class="back-link">← Volver al Admin</a>
            <h2>Bandeja de Mensajes</h2>
        </div>
    </div>

    <div class="contacts-container">
        <section class="contacts-section">
            <h3>Mensajes Recibidos</h3>
            <p class="muted">Mensajes enviados por los estudiantes desde el formulario de la web.</p>
            <div id="contacts-admin-list" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;">
            </div>
        </section>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script src="js/app.js"></script>
    <script src="js/contacto.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Espera inteligente para asegurar que app.js cargó Supabase
            setTimeout(async () => {
                if (!window.supabaseClient) {
                    alert("Error: Supabase no conectó.");
                    return;
                }

                const permsRaw = sessionStorage.getItem('aesfact_permissions');
                if (!permsRaw || !JSON.parse(permsRaw).includes('contactos')) {
                    alert('⛔ Acceso Restringido: No tienes permisos para ver los mensajes.');
                    window.location.href = 'admin.html';
                    return;
                }

                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (!session) {
                    window.location.href = 'admin.html';
                    return;
                }

                await window.loadContacts();
            }, 300);
        });

        // 1. Convertimos loadContacts en una función global (window)
        // para que contacto.js pueda llamarla después de borrar o actualizar.
        window.loadContacts = async function() {
            const data = await window.readData();
            if (data && data.contacts) {
                window.renderContactAdminList(data.contacts);
            }
        };

        // 2. Convertimos showNotification en global para que contacto.js la use.
        window.showNotification = function(message, type = 'success') {
            const notification = document.getElementById('notification');
            if(!notification) return;
            notification.textContent = message;
            notification.className = `notification ${type === 'error' ? 'error' : ''}`;
            notification.classList.remove('hidden');

            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        };
    </script>
</body>
</html>
