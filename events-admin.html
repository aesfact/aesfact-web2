<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Eventos - AESFACT</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.1"></script>
    <style>
        :root {
            --dark-blue: #04293a;
        }
        body { background-color: #f4f7f6; }
        .events-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .events-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .events-section {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .events-section h3 { margin-top: 0; color: var(--dark-blue); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0d5d9e; }
        .notification {
            position: fixed; top: 20px; right: 20px; background: #4caf50; color: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: all 0.3s;
        }
        .notification.error { background: #f44336; }
        .notification.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div style="background: white; padding: 15px; border-bottom: 1px solid #eee;">
        <div class="events-container" style="padding: 0; display: flex; justify-content: space-between; align-items: center;">
            <a href="admin.html" style="text-decoration: none; color: #555; font-weight: bold;">← Volver al Admin</a>
            <h2 style="margin: 0; color: var(--dark-blue);">Gestión de Eventos</h2>
        </div>
    </div>

    <div class="events-container">
        <section class="events-section">
            <h3>Agregar/Editar Evento</h3>
            <div class="form-grid">
                <div>
                    <label>📌 Título del Evento</label>
                    <input id="evt-title" placeholder="Ej: Asamblea General">
                </div>
                <div>
                    <label>📅 Fecha del Evento</label>
                    <input id="evt-date" type="date">
                </div>
            </div>
            <label>📝 Descripción</label>
            <textarea id="evt-desc" placeholder="Detalles, lugar, hora..."></textarea>
            
            <div class="admin-actions" style="margin-top: 10px;">
                <button id="add-evt" class="btn" onclick="addOrUpdateEvent()">Agregar Evento</button>
                <button id="cancel-evt" class="btn muted hidden">Cancelar</button>
            </div>
            <div id="event-admin-list" style="margin-top: 20px;"></div>
        </section>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabaseClient) window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const permsRaw = sessionStorage.getItem('aesfact_permissions');
            if (!permsRaw || !JSON.parse(permsRaw).includes('eventos')) {
                alert('⛔ Acceso Restringido.');
                window.location.href = 'admin.html'; return;
            }

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'admin.html'; return; }

            await loadAndRenderEvents();
        });

        async function loadAndRenderEvents() {
            const data = await window.readData();
            if (!data || !data.events) return;

            const listContainer = document.getElementById('event-admin-list');
            listContainer.innerHTML = '';
            data.events.forEach(evt => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h4>${escapeHtml(evt.title)}</h4>
                    <p class="muted">Fecha: ${evt.date || 'Sin fecha asignada'}</p>
                    <p style="white-space: pre-wrap;">${escapeHtml(evt.desc)}</p>
                    <button class="btn" onclick="editEvent('${evt.id}')">Editar</button>
                    <button class="btn muted" onclick="deleteEvent('${evt.id}')">Eliminar</button>
                `;
                listContainer.appendChild(card);
            });
        }

        async function editEvent(id) {
            const data = await window.readData();
            const evt = data.events.find(e => e.id === id);
            if (!evt) return;

            document.getElementById('evt-title').value = evt.title || '';
            document.getElementById('evt-date').value = evt.date || '';
            document.getElementById('evt-desc').value = evt.desc || '';
            
            window.currentEditId = id;
            document.getElementById('add-evt').textContent = 'Actualizar Evento';
            document.getElementById('cancel-evt').classList.remove('hidden');
            document.getElementById('cancel-evt').onclick = clearEventForm;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function deleteEvent(id) {
            if (!confirm('¿Estás seguro de eliminar este evento?')) return;
            try {
                const { error } = await window.supabaseClient.from('events').delete().eq('id', id);
                if (error) throw error;
                showNotification('Evento eliminado correctamente.');
                await loadAndRenderEvents();
            } catch (e) { showNotification('Error al eliminar evento.', 'error'); }
        }

        function clearEventForm() {
            document.getElementById('evt-title').value = '';
            document.getElementById('evt-date').value = '';
            document.getElementById('evt-desc').value = '';
            document.getElementById('add-evt').textContent = 'Agregar Evento';
            document.getElementById('cancel-evt').classList.add('hidden');
            window.currentEditId = null;
        }

        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification ${type}`;
            notif.classList.remove('hidden');
            setTimeout(() => notif.classList.add('hidden'), 3000);
        }

        // --- EL CRUD CORREGIDO ---
        // --- EL CRUD CORREGIDO DEFINITIVO ---
        // --- EL CRUD DEFINITIVO (PULIDO Y SIN ALERTAS TÉCNICAS) ---
        async function addOrUpdateEvent() {
            const title = document.getElementById('evt-title').value.trim();
            const dateRaw = document.getElementById('evt-date').value;
            const desc = document.getElementById('evt-desc').value.trim();

            if (!title || !desc) { 
                showNotification('Título y descripción son obligatorios.', 'error'); 
                return; 
            }

            const btn = document.getElementById('add-evt');
            const originalText = btn.textContent;
            btn.disabled = true; 
            btn.textContent = 'Guardando...';

            try {
                const payload = {
                    title: title,
                    desc: desc,
                    date: dateRaw || '' 
                };

                if (window.currentEditId) {
                    const { error } = await window.supabaseClient.from('events').update(payload).eq('id', window.currentEditId);
                    if (error) throw error;
                    showNotification('Evento actualizado correctamente.');
                } else {
                    payload.id = Date.now().toString();
                    const { error } = await window.supabaseClient.from('events').insert([payload]);
                    if (error) throw error;
                    showNotification('Evento agregado correctamente.');
                }
                clearEventForm();
                await loadAndRenderEvents();
            } catch (e) { 
                // El error técnico se queda en la consola en secreto para los desarrolladores
                console.error("🚨 Error BD:", e);
                // El administrador solo ve un mensaje amigable
                showNotification('Error al guardar el evento. Verifica los datos.', 'error'); 
            } finally { 
                btn.disabled = false; 
                btn.textContent = originalText;
            }
        }

        // Utilidad para pintar sin que falle el HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
